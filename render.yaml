services:
  - type: web
    name: navi-wallet-recovery
    runtime: python
    buildCommand: "python -m py_compile server.py"
    startCommand: "python server.py"
    healthCheckPath: /landing.html
    plan: starter
    disk:
      name: navi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NAVI_DATA_DIR
        value: /var/data
